[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiber-composite-calculator"
version = "0.1.0"
description = "Interactive fiber-reinforced composite calculator (Callister ch. 16) with step-by-step reports"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "İsmail Bilgehan Kazancı" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E741: `l` (fiber length) is the textbook symbol; renaming it would hurt readability.
# RUF001-003: Greek letters (σ, τ, ρ) are the textbook notation and Turkish text
# contains characters ruff calls ambiguous (ı, ’); both are intentional here.
ignore = ["E741", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/i18n/*" = ["E501"]
