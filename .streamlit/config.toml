# Light and dark themes; the app follows the viewer's system setting and can be
# switched from the ⋮ menu (Settings). Chart colors follow the active theme.
[theme.light]
primaryColor = "#1F6F78"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5F5"
textColor = "#1B2426"

[theme.dark]
primaryColor = "#4FB3BF"
backgroundColor = "#14191B"
secondaryBackgroundColor = "#1D2427"
textColor = "#E8ECEC"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
